name: GUI

env:
  PREK_DISABLE_INSTALL: "1"

permissions:
  contents: read

# GUI checks are intentionally separate from test.yml. The root workflow owns the
# repository's existing required contexts; this workflow adds GUI coverage only
# when GUI or engine-host code can change. Pushes stay limited to main so one SHA
# is not tested twice; pull requests cover feature branches.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gui.yml"
      - "package.json"
      - "package-lock.json"
      - "packages/gui/**"
      - "packages/coding-agent/docs/gui.md"
      - "packages/gui/docs/**"
      - "packages/coding-agent/package.json"
      - "packages/coding-agent/src/core/extensions/**"
      - "packages/coding-agent/src/modes/interactive-engine/**"
      - "packages/coding-agent/src/core/agent-session-runtime.ts"
      - "packages/coding-agent/src/utils/interactive-engine-bootstrap.ts"
      - "packages/coding-agent/src/utils/interactive-engine-env.ts"
      - "packages/coding-agent/src/modes/rpc/**"
      - "packages/natives/**"
      - "crates/atomic-natives/**"
  pull_request:
    paths:
      - ".github/workflows/gui.yml"
      - "package.json"
      - "package-lock.json"
      - "packages/gui/**"
      - "packages/coding-agent/docs/gui.md"
      - "packages/gui/docs/**"
      - "packages/coding-agent/package.json"
      - "packages/coding-agent/src/core/agent-session-runtime.ts"
      - "packages/coding-agent/src/utils/interactive-engine-bootstrap.ts"
      - "packages/coding-agent/src/utils/interactive-engine-env.ts"
      - "packages/coding-agent/src/core/extensions/**"
      - "packages/coding-agent/src/modes/interactive-engine/**"
      - "packages/coding-agent/src/modes/rpc/**"
      - "packages/natives/**"
      - "crates/atomic-natives/**"
  workflow_dispatch:

jobs:
  gui:
    name: gui (linux-x64)
    # This is the only GUI CI platform in this slice. It does not claim
    # macOS or Windows coverage; those platforms need separate evidence.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1.1
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        timeout-minutes: 4
        with:
          toolchain: stable
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # npm CI skips postinstall scripts by policy. Electron's binary is needed
      # by the Playwright Electron fixture tests, so install it explicitly.
      - name: Install Electron binary
        run: node node_modules/electron/install.js
      # The real-engine smoke starts the workspace CLI, whose bundled extensions
      # load the native binding. Build it before any GUI test runs.
      - name: Build native binding for GUI smoke
        run: npm run build --workspace=@bastani/atomic-natives
      - name: Install Linux Electron runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libatspi2.0-0 libdrm2 libgbm1 libgtk-3-0 libnotify4 libnss3 \
            libx11-xcb1 libxshmfence1 libxss1 libxtst6 xdg-utils xvfb
      - name: GUI tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npm run test:gui
      - name: GUI typecheck
        run: npm run typecheck:gui
      - name: GUI build
        run: npm run build --workspace=@bastani/atomic-gui
